# Ajustes de Yarn 4 para el frontend.
#
# Antes había aquí un `approvedGitRepositories: ["**"]` que sobraba: no hay ninguna
# dependencia que venga de un repositorio git (todas son de npm), así que no hacía nada.
# Y además rompía el build del servidor: el Yarn que se instala en el contenedor para
# compilar el frontend no conoce ese ajuste y abortaba con
# «Unrecognized or legacy configuration settings found: approvedGitRepositories».
#
# Los dos que quedan sí hacen falta:
#   · nodeLinker: node-modules → el proyecto usa node_modules normal, no el PnP de Yarn.
#   · enableScripts: true      → sin esto no corren los postinstall (esbuild y compañía).
#   · npmMinimalAgeGate: 0     → sin espera de seguridad por antigüedad de paquete; con el
#                                valor por defecto, una dependencia recién publicada haría
#                                fallar la instalación.

enableScripts: true

nodeLinker: node-modules

npmMinimalAgeGate: 0
