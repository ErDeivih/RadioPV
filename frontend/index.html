<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <!-- `viewport-fit=cover` es lo que hace que `env(safe-area-inset-bottom)` valga algo: sin él
         los estilos que apartan el reproductor de la barra de gestos de Android no sirven de nada
         (el valor es siempre 0). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101014" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RadioPV" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="shortcut icon" href="/favicon-64.png" />
    <!-- iOS no admite transparencia: apple-touch-icon.png va a sangre, sin alfa -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" sizes="32x32" type="image/png" href="/favicon32.png" />
    <link rel="icon" sizes="16x16" type="image/png" href="/favicon16.png" />
    <title>RadioPV</title>
  </head>

  <body>
    <noscript>Esta aplicación necesita JavaScript activado para funcionar.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
