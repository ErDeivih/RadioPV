# RadioPV · web estática (build de Vite) servida como SPA
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta desconocida la resuelve React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets llevan hash en el nombre: se pueden cachear fuerte
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # El service worker y el manifest NUNCA se cachean
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    # La API vive en otro contenedor; el frontend usa VITE_API_URL absoluta,
    # pero dejamos el atajo /api por comodidad.
    location /api/ {
        proxy_pass http://radiopv-api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
