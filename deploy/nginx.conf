# RadioPV · web estática (build de Vite) servida como SPA
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta desconocida la resuelve React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets llevan hash en el nombre: se pueden cachear fuerte
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # El service worker y el manifest NUNCA se cachean
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    # La API vive en otro contenedor. El frontend usa la URL RELATIVA /api
    # (frontend/.env.production + src/apiBase.ts), así que TODO pasa por aquí:
    # navegador y API comparten origen y no hace falta CORS ni recompilar para
    # cambiar de máquina (PC, móvil por Tailscale, IP de la LAN).
    #
    # proxy_pass con barra final: /api/tracks -> http://radiopv-api:8000/tracks
    location /api/ {
        proxy_pass http://radiopv-api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El audio se sirve por rangos: sin buffering, para poder hacer seek.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
