# RadioPV · web estática (build de Vite) servida como SPA
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta desconocida la resuelve React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets llevan hash en el nombre: se pueden cachear fuerte
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # El service worker y el manifest NUNCA se cachean
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    # ------------------------- API -------------------------
    # La API vive en otro contenedor. El frontend usa la URL RELATIVA /api
    # (frontend/.env.production + src/apiBase.ts), así que TODO pasa por aquí: navegador y
    # API comparten origen, no hace falta CORS y funciona desde cualquier máquina (PC, móvil
    # por Tailscale, IP de la LAN).
    #
    # OJO con el `resolver` y la variable: nginx resuelve el nombre de un `proxy_pass` fijo
    # UNA SOLA VEZ, al cargar la configuración, y se queda con esa IP para siempre. Como
    # Docker da una IP nueva al contenedor cada vez que se recrea (o sea, en cada
    # despliegue), la web empezaba a devolver 502 «connection refused» a la IP vieja. Con
    # `resolver` apuntando al DNS interno de Docker (127.0.0.11) y el destino en una
    # variable, nginx vuelve a preguntar cada 10 s y sobrevive a los despliegues.
    #
    # Y con variable, el prefijo del `location` YA NO se sustituye solo: el `rewrite ... break`
    # es lo que quita /api y deja la ruta tal como la espera FastAPI.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_arriba http://radiopv-api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_arriba;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El audio se sirve por rangos: sin buffering, para poder hacer seek.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
